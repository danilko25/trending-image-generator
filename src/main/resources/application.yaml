spring:
  application:
    name: AiGeneration
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      backoff:
        ms: 2000

  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.7

  datasource:
    url: jdbc:postgresql://localhost:5433/ai-generation-db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: true

logging:
  level:
    org.springframework.ai: DEBUG

fal:
  generation-model-endpoint: fal-ai/flux-2/klein/9b
  remove-background-model-endpoint: fal-ai/birefnet/v2
  upscale-model-endpoint: fal-ai/esrgan

image-prompt:
  generation:
    topic: internal.image-prompt.command.generation

image:
  generation:
    topic: internal.image.command.generation

subtask:
  generation:
    topic: internal.subtask.command.generation

task:
  generation:
    topic: internal.task.command.generation

server:
  port: 8086

parallel:
  connections:
    count: 10






